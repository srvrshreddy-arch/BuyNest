v<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BuyNest - Checkout</title>

    <link rel="stylesheet" href="checkout.css">

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header>

    <div class="logo">
        BuyNest
    </div>


    <nav>

        <a href="home.html">
            Home
        </a>

        <a href="product.html">
            Products
        </a>

        <a href="cart.html">
            Cart 🛒
        </a>

        <a href="login.html">
            Login
        </a>

    </nav>

</header>



<!-- =====================================================
     CHECKOUT PAGE
===================================================== -->

<main class="checkout-page">


    <h1>
        Checkout
    </h1>


    <p class="subtitle">
        Complete your order
    </p>



    <div class="checkout-container">


        <!-- =================================================
             DELIVERY DETAILS
        ================================================== -->

        <section class="delivery-box">


            <h2>
                📍 Delivery Address
            </h2>


            <!-- FIRST NAME + LAST NAME -->

            <div class="form-row">


                <div class="input-group">

                    <label>
                        First Name
                    </label>

                    <input
                        type="text"
                        id="firstName"
                        placeholder="Enter first name"
                    >

                </div>


                <div class="input-group">

                    <label>
                        Last Name
                    </label>

                    <input
                        type="text"
                        id="lastName"
                        placeholder="Enter last name"
                    >

                </div>


            </div>



            <!-- EMAIL -->

            <div class="input-group">

                <label>
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                >

            </div>



            <!-- PHONE -->

            <div class="input-group">

                <label>
                    Phone Number
                </label>

                <input
                    type="tel"
                    id="phone"
                    placeholder="Enter phone number"
                >

            </div>



            <!-- ADDRESS -->

            <div class="input-group">

                <label>
                    Address
                </label>

                <textarea
                    id="address"
                    placeholder="Enter your complete address"
                ></textarea>

            </div>



            <!-- CITY + PIN -->

            <div class="form-row">


                <div class="input-group">

                    <label>
                        City
                    </label>

                    <input
                        type="text"
                        id="city"
                        placeholder="City"
                    >

                </div>


                <div class="input-group">

                    <label>
                        PIN Code
                    </label>

                    <input
                        type="text"
                        id="pinCode"
                        placeholder="PIN code"
                    >

                </div>


            </div>



            <!-- =================================================
                 PAYMENT METHOD
            ================================================== -->

            <h2 class="payment-title">
                💳 Payment Method
            </h2>


            <label class="payment-option">

                <input
                    type="radio"
                    name="payment"
                    value="Cash on Delivery"
                    checked
                >

                Cash on Delivery

            </label>


            <label class="payment-option">

                <input
                    type="radio"
                    name="payment"
                    value="UPI"
                >

                UPI

            </label>


            <label class="payment-option">

                <input
                    type="radio"
                    name="payment"
                    value="Credit / Debit Card"
                >

                Credit / Debit Card

            </label>


        </section>



        <!-- =================================================
             ORDER SUMMARY
        ================================================== -->

        <section class="order-summary">


            <h2>
                Order Summary
            </h2>



            <!-- CART ITEMS WILL COME HERE -->

            <div id="checkoutItems">

                <p>
                    Loading cart items...
                </p>

            </div>



            <hr>



            <!-- SUBTOTAL -->

            <div class="order-item">

                <span>
                    Subtotal
                </span>

                <span id="subtotal">
                    ₹0
                </span>

            </div>



            <!-- DELIVERY -->

            <div class="order-item">

                <span>
                    Delivery
                </span>

                <span class="free">
                    FREE
                </span>

            </div>



            <hr>



            <!-- TOTAL -->

            <div class="total">

                <span>
                    Total
                </span>

                <span id="total">
                    ₹0
                </span>

            </div>



            <!-- PLACE ORDER -->

            <button
                class="place-order"
                id="placeOrderBtn"
            >

                Place Order

            </button>



            <!-- BACK TO CART -->

            <a
                href="cart.html"
                class="back-cart"
            >

                ← Back to Cart

            </a>


        </section>


    </div>

</main>



<!-- =====================================================
     FOOTER
===================================================== -->

<footer>

    <p>
        © 2026 BuyNest. All Rights Reserved.
    </p>

</footer>



<!-- =====================================================
     JAVASCRIPT
===================================================== -->

<script src="checkout.js"></script>


</body>

</html>
