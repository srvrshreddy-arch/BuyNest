<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BuyNest - Users</title>

    <link rel="stylesheet" href="admin user.css">
</head>

<body>

    <!-- ================= SIDEBAR ================= -->

    <aside class="sidebar">

        <div class="logo">
            BuyNest
        </div>

        <p class="admin-label">
            ADMIN PANEL
        </p>

        <a href="admin dashboard.html">
            📊 Dashboard
        </a>

        <a href="admin user.html" class="active">
            👥 Users
        </a>

        <a href="admin products.html">
            📦 Products
        </a>

        <a href="admin order.html">
            🛒 Orders
        </a>

        <a href="admin-delivery.html">
            🚚 Delivery
        </a>

        <a href="welcome.html" class="logout">
            ↪ Logout
        </a>

    </aside>


    <!-- ================= MAIN CONTENT ================= -->

    <main class="main-content">

        <header class="topbar">

            <div>
                <h1>Users</h1>

                <p>
                    Manage registered customers
                </p>
            </div>

            <div class="admin-profile">
                👨‍💼 Admin
            </div>

        </header>


        <!-- ================= USER SUMMARY ================= -->

        <section class="user-summary">

            <div class="summary-card">

                <div class="summary-icon">
                    👥
                </div>

                <div>

                    <p>
                        Total Users
                    </p>

                    <h2 id="totalUsers">
                        0
                    </h2>

                </div>

            </div>

        </section>


        <!-- ================= USERS TABLE ================= -->

        <section class="section">

            <h2>
                Registered Users
            </h2>

            <div class="table-container">

                <table>

                    <thead>

                        <tr>

                            <th>ID</th>

                            <th>Name</th>

                            <th>Email</th>

                            <th>Phone</th>

                            <th>Actions</th>

                        </tr>

                    </thead>

                    <tbody id="usersTableBody">

                        <!-- Users loaded from database -->

                    </tbody>

                </table>

            </div>

        </section>

    </main>


    <!-- ================= EDIT USER MODAL ================= -->

    <div id="editModal" class="modal">

        <div class="modal-content">

            <span
                class="close"
                onclick="closeEditModal()">

                &times;

            </span>

            <h2>
                Edit User
            </h2>

            <input
                type="hidden"
                id="editId">


            <label>
                Name
            </label>

            <input
                type="text"
                id="editName">


            <label>
                Email
            </label>

            <input
                type="email"
                id="editEmail">


            <label>
                Phone
            </label>

            <input
                type="number"
                id="editPhone">


            <label>
                Password
            </label>

            <input
                type="password"
                id="editPassword">


            <button
                class="save-btn"
                onclick="updateUser()">

                Update User

            </button>

        </div>

    </div>


    <script src="admin user.js"></script>

</body>

</html>
