<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>BuyNest - Cart</title>

    <link rel="stylesheet" href="cart.css">

</head>

<body>


<!-- ================= HEADER ================= -->

<header>

    <div class="logo">
        BuyNest
    </div>

    <nav>

        <a href="home.html">
            Home
        </a>

        <a href="products.html">
            Products
        </a>

        <a href="cart.html" class="active">
            Cart 🛒
        </a>

        <a href="orders.html">
            Orders
        </a>

        <a href="customer-login.html">
            Login
        </a>

    </nav>

</header>


<!-- ================= CART SECTION ================= -->

<section class="cart-section">

    <h1>
        Shopping Cart 🛒
    </h1>

    <p class="subtitle">
        Review your items before placing your order.
    </p>


    <div class="cart-container">


        <!-- ================= CART ITEMS ================= -->

        <div
            class="cart-items"
            id="cartItems">

            <p id="loading">
                Loading cart...
            </p>

        </div>


        <!-- ================= ORDER SUMMARY ================= -->

        <div class="summary">

            <h2>
                Order Summary
            </h2>


            <!-- SUBTOTAL -->

            <div class="summary-row">

                <span>
                    Subtotal
                </span>

                <span id="subtotal">
                    ₹0
                </span>

            </div>


            <!-- DELIVERY -->

            <div class="summary-row">

                <span>
                    Delivery
                </span>

                <span class="free">
                    FREE
                </span>

            </div>


            <hr>


            <!-- TOTAL -->

            <div class="total">

                <span>
                    Total
                </span>

                <span id="total">
                    ₹0
                </span>

            </div>


            <!-- CHECKOUT -->

            <button
                class="checkout"
                onclick="proceedToCheckout()">

                Proceed to Checkout

            </button>


            <!-- CONTINUE SHOPPING -->

            <a
                href="products.html"
                class="continue">

                ← Continue Shopping

            </a>

        </div>

    </div>

</section>


<!-- ================= FOOTER ================= -->

<footer>

    <p>
        © 2026 BuyNest. All Rights Reserved.
    </p>

</footer>


<!-- ================= JAVASCRIPT ================= -->

<script src="cart.js"></script>

</body>

</html>
