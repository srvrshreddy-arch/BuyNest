<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BuyNest - Products</title>

    <link rel="stylesheet" href="products.css">

</head>


<body>


<!-- ================= HEADER ================= -->

<header>

    <div class="logo">
        BuyNest
    </div>


    <nav>

        <a href="home.html">
            Home
        </a>

        <a href="products.html" class="active">
            Products
        </a>

        <a href="categories.html">
            Categories
        </a>

        <a href="orders.html">
            Orders
        </a>

        <a href="cart.html">
            Cart 🛒
        </a>

        <a href="customer-login.html">
            Login
        </a>

    </nav>

</header>



<!-- ================= PAGE TITLE ================= -->

<section class="page-heading">

    <h1>
        Our Products
    </h1>

    <p>
        Discover products you'll love at BuyNest
    </p>

</section>



<!-- ================= SEARCH AND FILTER ================= -->

<section class="filters">


    <!-- SEARCH -->

    <div class="search-box">

        <input
            type="text"
            id="searchInput"
            placeholder="Search products..."
        >

        <button id="searchButton">
            🔍
        </button>

    </div>



    <!-- CATEGORY -->

    <select id="categorySelect">

        <option value="">
            All Categories
        </option>

    </select>



    <!-- SORT -->

    <select id="sortSelect">

        <option value="">
            Sort By
        </option>

        <option value="priceLow">
            Price: Low to High
        </option>

        <option value="priceHigh">
            Price: High to Low
        </option>

        <option value="nameAZ">
            Name: A to Z
        </option>

        <option value="nameZA">
            Name: Z to A
        </option>

    </select>


</section>



<!-- ================= PRODUCTS ================= -->

<section class="products-section">

    <div
        class="product-grid"
        id="productGrid">
    </div>

</section>



<!-- ================= FOOTER ================= -->

<footer>

    <h2>
        BuyNest
    </h2>


    <p>
        Everything you need, all in one place.
    </p>


    <div class="footer-links">

        <a href="home.html">
            Home
        </a>

        <a href="products.html">
            Products
        </a>

        <a href="categories.html">
            Categories
        </a>

        <a href="orders.html">
            Orders
        </a>

        <a href="#">
            About Us
        </a>

        <a href="#">
            Contact
        </a>

    </div>


    <p class="copyright">

        © 2026 BuyNest. All Rights Reserved.

    </p>

</footer>



<!-- ================= JAVASCRIPT ================= -->

<script src="product.js"></script>


</body>

</html>
