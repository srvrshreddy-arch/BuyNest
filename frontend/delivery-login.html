<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BuyNest - Delivery Login</title>

    <link rel="stylesheet" href="delivary login.css">
</head>

<body>

    <div class="login-container">

        <h1>BuyNest</h1>

        <p class="subtitle">
            Delivery Partner Portal
        </p>

        <h2>
            Delivery Person Login
        </h2>

        <form id="deliveryLoginForm">

            <label>Email</label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >

            <label>Password</label>

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

        <p class="back">
            <a href="welcome.html">
                ← Back to Welcome
            </a>
        </p>

    </div>


    <!-- JavaScript -->

    <script src="delivery-login.js"></script>

</body>

</html>
